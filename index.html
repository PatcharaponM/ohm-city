:root{--ink:#13263F;--bg:#F3F5F9;--card:#fff;--muted:#5B6B80;--line:#DCE3EE;--acc:#FFD166;--ok:#2E9E4F;--bad:#D33A4C;--warn:#E8A317;--blue:#2F5BD3;--r:14px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Sukhumvit Set","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-size:16px;line-height:1.5}
h1,h2,h3,b,.k,button{font-family:Kanit,"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
h1{font-size:1.35rem;margin:0}h2{font-size:1.2rem;margin:.2rem 0 .7rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}h3{font-size:1rem;margin:.1rem 0 .6rem;display:flex;gap:.4rem;align-items:center}
p{margin:.35rem 0}
.ic{display:inline-flex;flex:none;vertical-align:middle}.ic svg{width:100%;height:100%}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}.mono{font-family:ui-monospace,monospace}.hidden{display:none!important}.grow{flex:1}
.err{color:var(--bad);font-weight:600;min-height:1em;margin:.3rem 0}
#app{max-width:1400px;margin:0 auto}
.screen{padding:12px 16px 40px}
.topbar{display:flex;align-items:center;gap:.6rem;padding:4px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.35rem;font-family:Kanit;font-weight:800;font-size:1.15rem;letter-spacing:.03em}
.brand .ic{color:#E8A317}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(19,38,63,.04)}
.card.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1.2fr}}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0}
.actions{display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:.6rem 1rem;font-size:1rem;font-weight:600;cursor:pointer;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary .ic{color:var(--acc)}
.btn.dark{background:#22344F;color:#fff;border-color:#22344F}
.btn.danger{color:var(--bad);border-color:#f2c3c9}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:.35rem .7rem;font-size:.9rem}
.btn.big{min-height:54px;font-size:1.1rem;padding:.7rem 1.4rem;width:100%}
@media(min-width:700px){.actions .btn.big{width:auto}}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);margin:.25rem 0}
textarea{font-family:ui-monospace,monospace;font-size:.8rem}
details>summary{cursor:pointer;font-family:Kanit;font-weight:600;display:flex;gap:.4rem;align-items:center;list-style:none;padding:.15rem 0}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details[open]>summary{margin-bottom:.6rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:.2rem 0 .4rem}
.seg button{border:0;background:#fff;padding:.55rem 1.1rem;font-size:1rem;cursor:pointer;min-height:44px}
.seg button.on{background:var(--ink);color:#fff}
.pname{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.pname b{flex:none;width:36px;height:36px;border-radius:10px;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center}
.pname input{margin:0}
.pchip{display:inline-flex;align-items:center;gap:.3rem;background:var(--pc);color:#fff;border-radius:999px;padding:.1rem .65rem .1rem .45rem;font-family:Kanit;font-weight:600;font-size:.95rem;max-width:100%}
.pchip.sm{font-size:.8rem}
.pchip b{font-size:.75em}
.badge{font-size:.8rem;padding:.15rem .55rem;border-radius:999px;background:#EEF2F7;color:var(--muted);white-space:nowrap}
.badge.ok{background:#E3F5E9;color:var(--ok)}.badge.warn{background:#FFF3D6;color:#9A6A00}
.tip{display:flex;gap:.5rem;background:#FFF8E1;border-radius:10px;padding:.7rem .8rem;margin-top:.8rem;font-size:.92rem}
.banner{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border-radius:12px;padding:.6rem .8rem;margin:0 0 12px;font-size:.92rem}
.banner.bad{background:#FDE7E9;color:#8E1B2A}
.conn-row{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.conn-row .pchip{margin-right:auto}
/* home */
.home{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:28px}
.hero{text-align:center}
.hero .logo{width:84px;height:84px;border-radius:24px;background:var(--ink);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(19,38,63,.25)}

.opt.pl{color:var(--c)}.opt.pl b{color:var(--ink)}.opt.pl.on{background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:0 0 0 2px var(--c) inset;border-color:var(--c)}

.line{border:1.5px dashed var(--line);border-radius:12px;padding:.5rem .6rem}
.line.act{border-style:solid;border-color:var(--ink)}

  const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; };
  const add = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
  const cmp = (a, b) => a.n * b.d - b.n * a.d;
  const val = a => a.n / a.d;
  const str = a => {
    let d = a.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5;
    const v = a.n / a.d;
    if (d === 1) return String(+v.toFixed(4));
    return `${a.n}/${a.d} ≈ ${v.toFixed(2)}`;
  };
  const parse = s => {
    s = String(s).trim().replace(',', '.');
    if (!s) return null;
    const m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
    if (m) return +m[2] ? F(+m[1], +m[2]) : null;
    if (!/^-?\d*\.?\d+$/.test(s)) return null;
    const [i, f = ''] = s.split('.');
    const d = 10 ** f.length;
    return F(Math.round(parseFloat(s) * d), d);
  };
  return { F, add, sub, cmp, val, str, parse };
})();

const Engine = (() => {
  const D = () => window.OHM_DATA;
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const r = new Uint32Array(1); (globalThis.crypto || window.crypto).getRandomValues(r);
      const j = r[0] % (i + 1);[a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const bById = id => id === 'B00' ? D().center.building : D().buildings.find(b => b.id === id);
  const randomLayout = () => {
    const ids = shuffle(D().buildings.map(b => b.id)).slice(0, 12);
    const layout = {}; D().sites.forEach((s, i) => { layout[s.no] = ids[i]; });
    return layout;
  };
  const siteBuilding = (st, key) => key === 'C' ? D().center.building : bById(st.layout[key]);
  const siteLabel = key => key === 'C' ? 'ศาลาว่าการ (กลางเมือง)' : `ฐาน ${key}`;
  const demandAmps = (b, V) => b.kind === 'I' ? Frac.F(b.value) : Frac.F(b.value, V);
  const demandText = b => b.kind === 'I' ? `${b.value} A` : `${b.value} W`;

  function newGame({ names, layout, mode = 'physical' }) {
    const n = names.length;
    const P = D().players;
    const seat = D().seatBonus[String(n)];
    const st = {
      v: 1, mode, phase: 'lobby', n, rounds: D().rounds[String(n)], round: 0, turnPos: 0,
      layout: layout || randomLayout(),
      claimed: {}, // siteKey -> {pid, plant, amps:{n,d}, lines}
      cap: {}, capMax: {},
      players: names.map((name, i) => ({
        id: i, name: name || `ผู้เล่น${P[i].th}`, color: P[i].color, sym: P[i].sym, colorTh: P[i].th,
        score: { build: 0, seat: seat[i], quiz: 0, event: 0, fuse: 0 },
        tools: { T1: false, T2: false, T3: false }, plants: [], claims: [],
        stats: { attempts: 0, success: 0, calcRight: 0, fuses: 0, quizRight: 0, quizTotal: 0 },
        tilesLeft: null, device: 'host'
      })),
      events: shuffle(D().events.map(e => e.id)), evPos: 0,
      quizOrder: shuffle(D().quiz.map((_, i) => i)), quizPos: 0, quiz: null,
      log: [], startedAt: null, endedAt: null
    };
    for (const [k, p] of Object.entries(D().plants)) { st.cap[k] = Frac.F(p.cap); st.capMax[k] = p.cap; }
    if (mode === 'digital' && typeof Board !== 'undefined') Board.init(st);
    return st;
  }
  const order = st => { const f = (st.round - 1) % st.n; return Array.from({ length: st.n }, (_, i) => (f + i) % st.n); };
  const currentPid = st => st.phase === 'play' ? order(st)[st.turnPos] : null;
  const eventNow = st => D().events.find(e => e.id === st.events[st.evPos]);
  const eventAt = (st, k) => { const id = st.events[st.evPos + k]; return id ? D().events.find(e => e.id === id) : null; };
  const log = (st, text, pid = null) => { st.log.unshift({ r: st.round, t: Date.now(), text, pid }); if (st.log.length > 200) st.log.pop(); };
  const total = (st, p) => { const s = p.score; return s.build + s.seat + s.quiz + s.event - s.fuse + (st.phase === 'end' ? diversity(p) : 0); };
  const diversity = p => ({ 3: 3, 4: 6 })[p.plants.length] || 0;

  function start(st) {
    st.phase = 'play'; st.round = 0; st.startedAt = Date.now();
    log(st, 'เริ่มเกม! ไฟดับทั้งเมือง วิศวกรทุกคนเตรียมพร้อม');
    nextRound(st);
  }
  function nextRound(st) {
    st.round += 1; st.turnPos = 0;
    if (st.round > 1) st.evPos += 1;
    if (st.round > st.rounds || st.evPos >= st.events.length) return finish(st);
    const e = eventNow(st);
    log(st, `รอบ ${st.round} เริ่ม · เหตุการณ์: ${e.th}`);
    const m = e.effect.match(/^cap:(\w):(\d+)$/);
    if (m) {
      st.cap[m[1]] = Frac.add(st.cap[m[1]], Frac.F(+m[2])); st.capMax[m[1]] += +m[2];
      log(st, `${D().plants[m[1]].th} ได้กำลังผลิตเพิ่ม +${m[2]} A`);
    }
    if (e.effect === 'quiz') openQuiz(st);
  }
  function endTurn(st) {
    if (st.phase !== 'play') return;
    st.turnPos += 1;
    if (st.turnPos >= st.n) nextRound(st);
  }
  function finish(st) {
    st.phase = 'end'; st.endedAt = Date.now(); st.quiz = null;
    if (st.mode === 'digital') st.players.forEach(p => { p.tilesLeft = Object.values(p.supply || {}).reduce((a, b) => a + b, 0); });
    st.round = Math.min(st.round, st.rounds);
    log(st, 'จบเกม! นับคะแนนพลังงานผสมและสรุปผล');
  }
  function allClaimed(st) { return Object.keys(st.claimed).length >= 13; }

  /* ---- connect (จ่ายไฟ) ---- */
  function evaluate(st, pid, req) {
    const errs = [];
    const steps = [];
    const key = String(req.site);
    const b = (key === 'C' || st.layout[key]) ? siteBuilding(st, key) : null;
    const plant = D().plants[req.plant];
    if (st.phase !== 'play') errs.push('เกมยังไม่เริ่มหรือจบไปแล้ว');
    if (pid !== currentPid(st)) errs.push('ยังไม่ถึงตาของคุณ (จ่ายไฟได้เฉพาะในเทิร์นตัวเอง)');
    if (!b) errs.push('ไม่พบอาคารนี้');
    if (!plant) errs.push('กรุณาเลือกโรงไฟฟ้า');
    if (b && st.claimed[key]) errs.push('อาคารนี้มีเจ้าของแล้ว');
    const lines = (req.lines || []).filter(l => Array.isArray(l) && l.length);
    if (!lines.length) errs.push('กรุณากรอกแผ่นในสาย');
    if (lines.length > 2) errs.push('ต่อขนานได้สูงสุด 2 สาย');
    const allowed = Object.keys(D().tiles).map(Number);
    if (lines.some(l => l.some(v => !allowed.includes(+v)))) errs.push('ค่าแผ่นไม่ถูกต้อง');
    if (lines.some(l => l.length < D().minLine)) errs.push(`สายแต่ละเส้นต้องยาวอย่างน้อย ${D().minLine} แผ่น`);
    const ev = st.phase === 'play' ? eventNow(st) : null;
    if (plant && ev && ev.effect === 'block:' + req.plant) errs.push(`รอบนี้ ${plant.th} จ่ายไฟไม่ได้ (เหตุการณ์: ${ev.th})`);
    if (errs.length) return { valid: false, errs };
    const V = plant.V;
    let itot = Frac.F(0);
    lines.forEach((l, i) => {
      const R = l.reduce((a, v) => a + +v, 0);
      const I = Frac.F(V, R);
      itot = Frac.add(itot, I);
      steps.push(`สาย${lines.length > 1 ? 'เส้นที่ ' + (i + 1) : ''}: R = ${l.join(' + ')} = ${R} Ω → I = ${V} ÷ ${R} = ${Frac.str(I)} A`);
    });
    if (lines.length > 1) steps.push(`ต่อขนาน: กระแสรวม = ${lines.map((l) => Frac.str(Frac.F(V, l.reduce((a, v) => a + +v, 0)))).join(' + ')} = ${Frac.str(itot)} A`);
    const need = demandAmps(b, V);
    steps.push(b.kind === 'I' ? `${b.th} ต้องการกระแส ${b.value} A` : `${b.th} ต้องการ ${b.value} W → I = P ÷ V = ${b.value} ÷ ${V} = ${Frac.str(need)} A`);
    const match = Frac.cmp(itot, need) === 0;
    const capOk = Frac.cmp(st.cap[req.plant], need) >= 0;
    let declared = req.answer != null ? Frac.parse(req.answer) : null;
    const calcRight = declared ? Frac.cmp(declared, itot) === 0 || Math.abs(Frac.val(declared) - Frac.val(itot)) < 0.011 : false;
    const hint = (() => {
      const R = Frac.F(V * need.d, need.n); // V / need
      return R.d === 1 ? `ถ้าใช้สายเดียว ต้องมี R = ${V} ÷ ${Frac.str(need)} = ${R.n} Ω` : `R ที่ต้องการ = ${V} ÷ ${Frac.str(need)} = ${Frac.str(R)} Ω ซึ่งสายเดียวทำไม่ได้ ลองต่อขนาน 2 สาย`;
    })();
    return { valid: true, b, plant, key, lines, itot, need, match, capOk, steps, declared, calcRight, hint };
  }
  function connect(st, pid, req) {
    const r = evaluate(st, pid, req);
    const p = st.players[pid];
    if (!r.valid) return { ok: false, rejected: true, errs: r.errs };
    p.stats.attempts += 1;
    if (r.declared) { if (r.calcRight) p.stats.calcRight += 1; }
    const res = { ok: false, steps: r.steps, building: r.b.th, site: r.key, plant: r.plant.th, calcRight: r.calcRight, declared: req.answer, itot: Frac.str(r.itot) };
    if (!r.capOk) {
      res.rejected = true;
      res.errs = [`${r.plant.th} มีกำลังผลิตเหลือ ${Frac.str(st.cap[req.plant])} A ไม่พอสำหรับ ${Frac.str(r.need)} A`];
      p.stats.attempts -= 1;
      return res;
    }
    if (!r.match) {
      p.score.fuse += D().fusePenalty; p.stats.fuses += 1;
      res.fuse = true; res.hint = r.hint;
      res.verdict = `ไม่ตรง! ได้ ${Frac.str(r.itot)} A แต่ต้องการ ${Frac.str(r.need)} A → ฟิวส์ขาด −${D().fusePenalty} VP`;
      log(st, `⚠ ${p.name} ฟิวส์ขาดที่${r.b.th} (ได้ ${Frac.str(r.itot)} A ต้องการ ${Frac.str(r.need)} A) −${D().fusePenalty} VP`, pid);
      return res;
    }
    // success
    let bonus = 0;
    const ev = eventNow(st);
    if (ev.effect === 'bonusAll:1') bonus += 1;
    if (ev.effect === 'bonusLow:2' && Frac.cmp(r.need, Frac.F(2)) <= 0) bonus += 2;
    st.cap[req.plant] = Frac.sub(st.cap[req.plant], r.need);
    st.claimed[r.key] = { pid, plant: req.plant, amps: r.need, lines: r.lines };
    p.score.build += r.b.vp; p.score.event += bonus;
    if (!p.plants.includes(req.plant)) p.plants.push(req.plant);
    p.claims.push(r.key); p.stats.success += 1;
    res.ok = true; res.vp = r.b.vp; res.bonus = bonus;
    res.verdict = `ตรงพอดี! ${r.b.th} ได้ไฟแล้ว +${r.b.vp} VP${bonus ? ` (+${bonus} จากเหตุการณ์)` : ''}`;
    log(st, `⚡ ${p.name} จ่ายไฟให้${r.b.th} จาก${r.plant.th} ${Frac.str(r.need)} A${r.lines.length > 1 ? ' (ต่อขนาน)' : ''} +${r.b.vp + bonus} VP`, pid);
    if (allClaimed(st)) finish(st);
    return res;
  }
  /* ---- quiz ---- */
  function openQuiz(st) {
    const qi = st.quizOrder[st.quizPos % st.quizOrder.length]; st.quizPos += 1;
    st.quiz = { qi, answers: {}, revealed: false };
    log(st, 'ควิซไฟฟ้า! ทุกคนตอบพร้อมกัน');
  }
  function answerQuiz(st, pid, choice) {
    if (!st.quiz || st.quiz.revealed) return false;
    if (st.quiz.answers[pid] != null) return false;
    if (![0, 1, 2, 3].includes(choice)) return false;
    st.quiz.answers[pid] = choice; return true;
  }
  function revealQuiz(st) {
    if (!st.quiz || st.quiz.revealed) return;
    const q = D().quiz[st.quiz.qi];
    st.quiz.revealed = true;
    const right = [];
    st.players.forEach(p => {
      const a = st.quiz.answers[p.id];
      p.stats.quizTotal += 1;
      if (a === q.answer) { p.score.quiz += 1; p.stats.quizRight += 1; right.push(p.name); }
    });
    log(st, `เฉลยควิซ: ${q.choices[q.answer]} · ตอบถูก: ${right.length ? right.join(', ') : 'ไม่มี'}`);
  }
  function closeQuiz(st) { if (st.quiz && !st.quiz.revealed) revealQuiz(st); st.quiz = null; }
  function useTool(st, pid, tid) {
    const p = st.players[pid]; const t = D().tools.find(x => x.id === tid);
    if (!p || !t || p.tools[tid]) return false;
    if (pid !== currentPid(st)) return false;
    p.tools[tid] = true; log(st, `🛠 ${p.name} ใช้การ์ด “${t.th}”`, pid); return true;
  }
  function adjust(st, pid, delta, why) { const p = st.players[pid]; p.score.event += delta; log(st, `${p.name} ${delta > 0 ? '+' : ''}${delta} VP (${why})`, pid); }
  function ranking(st) {
    return st.players.map(p => ({ p, total: total(st, p) }))
      .sort((a, b) => b.total - a.total || (b.p.tilesLeft ?? 0) - (a.p.tilesLeft ?? 0));
  }
  function publicState(st) { return JSON.parse(JSON.stringify(st)); }
  return { newGame, randomLayout, start, endTurn, nextRound, finish, evaluate, connect, openQuiz, answerQuiz, revealQuiz, closeQuiz, useTool, adjust,
    order, currentPid, eventNow, eventAt, total, diversity, ranking, siteBuilding, siteLabel, demandText, bById, publicState, shuffle };
})();


/* OHM CITY – digital board rules (host-authoritative).
   Placement, rewiring, tools and connecting are validated here from the board geometry,
   then scoring goes through Engine.connect so both modes share one rule set. */
const Board = (() => {
  const D = () => (globalThis.window || globalThis).OHM_DATA;
  const K = (x, y) => x + ',' + y;
  const XY = k => k.split(',').map(Number);
  const NB = (x, y) => [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < D().W && b < D().H);
  let _sites = null, _starts = null;
  const siteCells = () => {
    if (_sites) return _sites;
    _sites = {}; D().sites.forEach(s => { _sites[K(s.x, s.y)] = String(s.no); });
    _sites[K(D().center.x, D().center.y)] = 'C';
    return _sites;
  };
  const startCells = () => {
    if (_starts) return _starts;
    _starts = {}; for (const [k, p] of Object.entries(D().plants)) for (const [x, y] of p.starts) _starts[K(x, y)] = k;
    return _starts;
  };
  const siteXY = key => {
    if (key === 'C') return [D().center.x, D().center.y];
    const s = D().sites.find(s => String(s.no) === String(key)); return [s.x, s.y];
  };
  const err = m => ({ ok: false, err: m });

  function init(st) {
    st.board = { tiles: {}, under: {}, cones: [], lines: {}, nextLine: 1 };
    st.players.forEach(p => { p.supply = {}; for (const [v, n] of Object.entries(D().tiles)) p.supply[v] = n; });
    st.turn = null;
  }
  const turnKey = st => `${st.round}-${st.turnPos}`;
  function turn(st) {
    if (!st.turn || st.turn.key !== turnKey(st)) {
      const ev = Engine.eventNow(st);
      const eff = ev ? ev.effect : '';
      st.turn = { key: turnKey(st), pid: Engine.currentPid(st), placed: 0, max: eff === 'build3' ? 3 : (eff === 'build1' ? 1 : 2),
        action: null, changes: 0, free: eff === 'freeRewire' ? 1 : 0, tool: null, bridge: false, connected: false, hist: [] };
    }
    return st.turn;
  }
  const canAct = (st, pid) => st.phase !== 'play' ? 'เกมยังไม่เริ่มหรือจบแล้ว' : (pid !== Engine.currentPid(st) ? 'ยังไม่ถึงตาของคุณ' : null);
  const openLines = (st, pid) => Object.values(st.board.lines).filter(l => l.pid === pid && !l.site);
  const tileOf = (st, l, k) => { const t = st.board.tiles[k]; if (t && t.line === l.id) return t; const u = st.board.under[k]; return u && u.line === l.id ? u : null; };
  const lineValues = (st, l) => l.cells.map(([x, y]) => tileOf(st, l, K(x, y)).v);
  function touchesOwn(st, x, y, pid, exceptK) {
    return NB(x, y).some(([a, b]) => {
      const k = K(a, b); if (k === exceptK) return false;
      const t = st.board.tiles[k], u = st.board.under[k];
      return (t && t.pid === pid) || (u && u.pid === pid);
    });
  }
  function cellOpen(st, k, pid, bridge) {
    if (siteCells()[k] || st.board.cones.includes(k)) return false;
    const t = st.board.tiles[k];
    if (!t) return true;
    return bridge && t.pid !== pid && !st.board.under[k];
  }
  /** Every cell the player may place on now: cellKey → {line} (extend) or {start, origin} (new line). */
  function targets(st, pid, bridge = false) {
    const out = {};
    for (const l of openLines(st, pid)) {
      const [ex, ey] = l.cells[l.cells.length - 1];
      for (const [x, y] of NB(ex, ey)) {
        const k = K(x, y);
        if (cellOpen(st, k, pid, bridge) && !touchesOwn(st, x, y, pid, K(ex, ey))) out[k] = { line: l.id };
      }
    }
    const addStart = (k, plant, origin) => {
      if (out[k]) return;
      const [x, y] = XY(k);
      if (cellOpen(st, k, pid, bridge) && !touchesOwn(st, x, y, pid, null)) out[k] = { start: plant, origin };
    };
    for (const [k, plant] of Object.entries(startCells())) addStart(k, plant, 'plant');
    for (const [key, c] of Object.entries(st.claimed)) {
      if (c.pid !== pid) continue;
      const [sx, sy] = siteXY(key);
      for (const [x, y] of NB(sx, sy)) addStart(K(x, y), c.plant, 'sub:' + key);
    }
    return out;
  }
  function snap(st, pid) {
    const t = st.turn, p = st.players[pid];
    t.hist.push(JSON.stringify({ board: st.board, supply: p.supply, tools: p.tools, turn: { ...t, hist: null } }));
    if (t.hist.length > 40) t.hist.shift();
  }
  function undo(st, pid) {
    const e = canAct(st, pid); if (e) return err(e);
    const t = turn(st); if (!t.hist.length) return err('ไม่มีอะไรให้ย้อนกลับ');
    const s = JSON.parse(t.hist.pop()); const hist = t.hist;
    st.board = s.board; st.players[pid].supply = s.supply; st.players[pid].tools = s.tools; st.turn = { ...s.turn, hist };
    return { ok: true };
  }
  function place(st, pid, x, y, v) {
    const e = canAct(st, pid); if (e) return err(e);
    const t = turn(st), p = st.players[pid];
    if (t.action === 'rewire') return err('เทิร์นนี้เลือกปรับวงจรแล้ว วางแผ่นเพิ่มไม่ได้');
    if (t.placed >= t.max) return err(`เทิร์นนี้วางได้สูงสุด ${t.max} แผ่น`);
    v = +v; if (!(p.supply[v] > 0)) return err(`ไม่มีแผ่น ${v}Ω เหลือในคลัง`);
    const k = K(x, y); const tg = targets(st, pid, t.bridge)[k];
    if (!tg) return err('วางตรงนี้ไม่ได้: ต้องต่อจากปลายสาย หรือเริ่มที่ช่อง ⚡ ที่ว่าง และห้ามแตะสายตัวเองเส้นอื่น');
    snap(st, pid);
    if (st.board.tiles[k]) { st.board.under[k] = st.board.tiles[k]; t.bridge = false; }
    let line;
    if (tg.line) { line = st.board.lines[tg.line]; line.cells.push([x, y]); }
    else {
      const id = 'L' + (st.board.nextLine++);
      line = { id, pid, plant: tg.start, origin: tg.origin, cells: [[x, y]], site: null };
      st.board.lines[id] = line;
    }
    st.board.tiles[k] = { pid, v, line: line.id };
    p.supply[v] -= 1; t.placed += 1; t.action = 'build';
    return { ok: true };
  }
  function rewireCheck(t) {
    if (t.action === 'build') return t.changes < t.free ? null : 'เทิร์นนี้เลือกสร้างแล้ว ปรับวงจรไม่ได้';
    if (t.changes >= 2 + t.free) return 'ปรับวงจรครบแล้วในเทิร์นนี้';

function cityMap(st, { compact = false } = {}) {
  const C = 10, W = DATA.W, H = DATA.H, B = 7; // cell, grid, band
  const vw = W * C + 2 * B, vh = H * C + 2 * B;
  const parts = [`<svg viewBox="0 0 ${vw} ${vh}" class="citymap" xmlns="http://www.w3.org/2000/svg" font-family="Kanit, system-ui, sans-serif">`];
  parts.push(`<rect x="0" y="0" width="${vw}" height="${vh}" rx="3" fill="#F6F2E8"/>`);
  parts.push(`<rect x="${B}" y="${B}" width="${W * C}" height="${H * C}" fill="#EEF3F9" stroke="#13263F" stroke-width=".5"/>`);
  const startOf = {};
  for (const [k, p] of Object.entries(DATA.plants)) for (const [x, y] of p.starts) startOf[x + ',' + y] = k;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = startOf[x + ',' + y];
    parts.push(`<rect x="${B + x * C}" y="${B + y * C}" width="${C}" height="${C}" fill="${k ? plantOf(k).color + '33' : 'none'}" stroke="#C9D6E6" stroke-width=".25"/>`);
  }

    parts.push(`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="1.5" fill="${p.color}"/>`);
    const label = `${p.V}V · เหลือ ${cap} A`;

  };

  band('S', B + 4 * C, B + H * C + .8, 5 * C, B - 1.6, false);
  band('W', .8, B + 2 * C, B - 1.6, 5 * C, true);
  band('E', B + W * C + .8, B + 2 * C, B - 1.6, 5 * C, true);

    if (!cl) parts.push(`<rect x="${X + .4}" y="${Y + .4}" width="${C - .8}" height="2.4" rx="1" fill="${isI ? '#13263F' : '#8A5A00'}"/><text x="${X + C / 2}" y="${Y + 2.2}" font-size="1.9" fill="#fff" text-anchor="middle">${key === 'C' ? 'ศาลาฯ' : 'ฐาน ' + key}  ★${b.vp}</text>`);

const App = {
  screen: 'home',
  go(s) { this.screen = s; this.render(); },
  render() {
    const root = $('#app');
    let view;
    switch (this.screen) {
      case 'hostSetup': Host.st = null; view = Host.setupScreen(); this.screen = 'host'; break;
      case 'host': view = Host.screen(); break;
      case 'player': view = Player.screen(); break;
      case 'help': view = helpScreen(); break;
      default: view = homeScreen();
    }

    root.replaceChildren(view);
    if (this.screen === 'host' || this.screen === 'player') window.scrollTo(0, y);
  }
